services:
  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:v0.36
    container_name: zerobyte
    restart: unless-stopped
    environment:
      TZ: UTC
      BASE_URL: ${ZEROBYTE_URL}
      APP_SECRET: ${ZEROBYTE_APP_SECRET}
      LOG_LEVEL: info
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./.volumes/zerobyte/data:/var/lib/zerobyte
      - ./.volumes:/backup-targets:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: sdlc-net
      traefik.http.routers.zerobyte.rule: Host(`${ZEROBYTE_DOMAIN}`)
      traefik.http.routers.zerobyte.entrypoints: websecure
      traefik.http.routers.zerobyte.tls: "true"
      traefik.http.routers.zerobyte.tls.certresolver: letsencrypt
      traefik.http.services.zerobyte.loadbalancer.server.port: "4096"
    networks:
      - sdlc-net

networks:
  sdlc-net:
    external: true
